name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    # actionlint rejects the `$/` self-repository form; the relative path is equivalent.
    uses: ./.github/workflows/verify.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  publish:
    needs: verify
    # A manual dispatch from another branch must not overwrite the version and latest tags.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the package version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # The gateway hosts are a mix of arm64 and amd64.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          {
            echo "## Published"
            echo
            echo "- \`$IMAGE@$DIGEST\`"
            echo "- version \`$VERSION\`, sha \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}

  # The operator's infrastructure repository pins the image by digest. The
  # releaser app commits the bump straight to its main through the API, which
  # signs the commit; the app bypasses the required-checks ruleset there, and
  # the deploy workflow runs on the push.
  bump-infra:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    env:
      INFRA_REPO: uinaf/zebroid-infra
      COMPOSE_PATH: platform/gatewai-console/compose.yaml
    steps:
      - id: releaser
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.UINAF_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.UINAF_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: zebroid-infra
          permission-contents: write

      - name: Push the digest bump
        env:
          GH_TOKEN: ${{ steps.releaser.outputs.token }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          VERSION: ${{ needs.publish.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          short="${SOURCE_SHA:0:7}"
          # expectedHeadOid rejects the commit when main moved since the read; re-read and retry.
          for attempt in 1 2 3; do
            base=$(gh api "repos/$INFRA_REPO/git/ref/heads/main" --jq .object.sha)
            gh api "repos/$INFRA_REPO/contents/$COMPOSE_PATH?ref=$base" --jq .content | base64 -d > compose.yaml
            current=$(sed -nE "s|^ *image: $IMAGE:[^@]+@(sha256:[0-9a-f]{64})$|\1|p" compose.yaml)
            if [ -z "$current" ]; then
              echo "::error::$COMPOSE_PATH on $INFRA_REPO@${base:0:7} has no digest-pinned image line for $IMAGE"
              exit 1
            fi
            if [ "$current" = "$DIGEST" ]; then
              echo "already pinned to $DIGEST" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sed -i -E "s|^( *image: )$IMAGE:[^@]+@sha256:[0-9a-f]{64}$|\1$IMAGE:$VERSION@$DIGEST|" compose.yaml
            grep -q "$DIGEST" compose.yaml
            jq -n --arg repo "$INFRA_REPO" --arg base "$base" \
              --arg path "$COMPOSE_PATH" --arg contents "$(base64 -w0 compose.yaml)" \
              --arg headline "chore(platform): gatewai-console at $short" \
              --arg body "$IMAGE:$VERSION@$DIGEST from https://github.com/$SOURCE_REPO/commit/$SOURCE_SHA" '{
                query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
                variables: { input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: "main" },
                  expectedHeadOid: $base,
                  message: { headline: $headline, body: $body },
                  fileChanges: { additions: [ { path: $path, contents: $contents } ] }
                } }
              }' > commit.json
            if oid=$(gh api graphql --input commit.json --jq '.data.createCommitOnBranch.commit.oid'); then
              echo "- bump: https://github.com/$INFRA_REPO/commit/$oid" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt: main moved past ${base:0:7}; retrying" >&2
            sleep $((attempt * 5))
          done
          echo "::error::could not commit the digest bump after 3 attempts"
          exit 1

  # Every push publishes a multi-arch image; keep the registry to the last few.
  # Runs only after the bump landed, so the deployed digest is never pruned away.
  prune-registry:
    needs: [publish, bump-infra]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ github.event.repository.name }}
          owner: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          keep-n-tagged: 5
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
