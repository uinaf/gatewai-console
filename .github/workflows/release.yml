name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    # actionlint rejects the `$/` self-repository form; the relative path is equivalent.
    uses: ./.github/workflows/verify.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  publish:
    needs: verify
    # A manual dispatch from another branch must not overwrite the version and latest tags.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the package version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # The gateway hosts are a mix of arm64 and amd64.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          {
            echo "## Published"
            echo
            echo "- \`$IMAGE@$DIGEST\`"
            echo "- version \`$VERSION\`, sha \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}

  # The operator's infrastructure repository pins the image by digest. Open the
  # bump there as the releaser app so its checks run and it merges on green.
  bump-infra:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    env:
      INFRA_REPO: uinaf/zebroid-infra
      COMPOSE_PATH: platform/gatewai-console/compose.yaml
    steps:
      - id: releaser
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.UINAF_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.UINAF_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: zebroid-infra
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ steps.releaser.outputs.token }}
          persist-credentials: true

      - name: Open the digest bump
        env:
          GH_TOKEN: ${{ steps.releaser.outputs.token }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          VERSION: ${{ needs.publish.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          short="${SOURCE_SHA:0:7}"
          branch="chore/gatewai-console-$short"
          current=$(sed -nE "s|^ *image: $IMAGE:[^@]+@(sha256:[0-9a-f]{64})$|\1|p" "$COMPOSE_PATH")
          if [ "$current" = "$DIGEST" ]; then
            echo "already pinned to $DIGEST" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sed -i -E "s|^( *image: )$IMAGE:[^@]+@sha256:[0-9a-f]{64}$|\1$IMAGE:$VERSION@$DIGEST|" "$COMPOSE_PATH"
          grep -q "$DIGEST" "$COMPOSE_PATH"
          git config user.name "uinaf-releaser[bot]"
          git config user.email "uinaf-releaser[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "chore(platform): gatewai-console at $short"
          git push origin "$branch"
          cat > "$RUNNER_TEMP/body.md" <<'BODY'
          ## Problem

          The gateway hosts run an older console image than `__REPO__` publishes for `__SHORT__`.

          ## Solution

          Pin `__IMAGE__:__VERSION__@__DIGEST__`, opened by the release workflow of [__REPO__@__SHORT__](https://github.com/__REPO__/commit/__SHA__).

          ## Proof

          Deploy on merge; both hosts must pass the console `/healthz` check.
          BODY
          sed -i -e "s|__REPO__|$SOURCE_REPO|g" -e "s|__SHORT__|$short|g" -e "s|__IMAGE__|$IMAGE|g" \
            -e "s|__VERSION__|$VERSION|g" -e "s|__DIGEST__|$DIGEST|g" -e "s|__SHA__|$SOURCE_SHA|g" "$RUNNER_TEMP/body.md"
          url=$(gh pr create --repo "$INFRA_REPO" --base main --head "$branch" \
            --title "chore(platform): gatewai-console at $short" --body-file "$RUNNER_TEMP/body.md")
          gh pr merge --repo "$INFRA_REPO" --squash --auto "$url"
          echo "- bump: $url" >> "$GITHUB_STEP_SUMMARY"

  # Every push publishes a multi-arch image; keep the registry to the last few.
  prune-registry:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ github.event.repository.name }}
          owner: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          keep-n-tagged: 5
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
